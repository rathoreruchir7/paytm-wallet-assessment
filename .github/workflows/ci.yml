name: wallet-correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  docker-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint
        run: |
          python -m pip install ruff==0.16.6
          ruff check app tests scripts
          ruff format --check app tests scripts
      - name: Build, test, burst, and restart
        run: python scripts/verify.py
      - name: Capture logs and metrics
        if: always()
        run: |
          mkdir -p evidence
          docker compose logs --no-color app > evidence/container-logs.txt
          curl --fail --max-time 10 http://localhost:8000/metrics > evidence/metrics.prom || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallet-evidence
          path: evidence/
      - name: Stop test stack
        if: always()
        run: docker compose down

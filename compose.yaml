services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: local-postgres-development-only
      POSTGRES_DB: wallet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://wallet:local-postgres-development-only@db:5432/wallet
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-assessment-admin-token-change-before-deploy}
      ENABLE_FIXTURES: "true"
      PUBLIC_LOGS: "true"
      DB_POOL_SIZE: "10"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  test:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql://wallet:local-postgres-development-only@db:5432/wallet
    depends_on:
      db:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  postgres_data:

services:
  - type: web
    name: wallet-p2p-assessment
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m app.run
    healthCheckPath: /readyz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wallet-p2p-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ENABLE_FIXTURES
        value: "true"
      - key: PUBLIC_LOGS
        value: "true"
      - key: DB_POOL_SIZE
        value: "10"
databases:
  - name: wallet-p2p-db
    plan: free
    region: oregon
    databaseName: wallet
    user: wallet
    postgresMajorVersion: "16"
    ipAllowList: []
